<p class="caption">
  v6 — logo secundario, tamaño chico, mismo mecanismo: cada letra se dibuja por su contorno y recién al
  terminar se rellena. Fade final y loop, igual que la v4 que armamos, solo con la geometría apilada.
</p>

<script>
const HOLD = 1300;
const FADEOUT = 500;
const paths = Array.from(document.querySelectorAll('.p')).map(el => {
  const len = el.getTotalLength();
  el.style.fill = 'none';
  el.style.stroke = el.dataset.color;
  el.style.strokeWidth = '3';
  el.style.strokeDasharray = len;
  return {
    el, len,
    start: parseFloat(el.dataset.start),
    drawDur: parseFloat(el.dataset.drawdur),
    fillDur: parseFloat(el.dataset.filldur),
    color: el.dataset.color
  };
});

const lastEnd = Math.max(...paths.map(p => p.start + p.drawDur + p.fillDur));
const CYCLE = lastEnd + HOLD + FADEOUT + 300;
const allGroup = document.getElementById('all');

function clamp01(x){ return Math.max(0, Math.min(1, x)); }
function ease(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

function frame(now){
  const t = now % CYCLE;
  paths.forEach(p => {
    const drawT = clamp01((t - p.start) / p.drawDur);
    const drawEase = ease(drawT);
    p.el.style.strokeDashoffset = p.len * (1 - drawEase);
    const fillStart = p.start + p.drawDur;
    const fillT = clamp01((t - fillStart) / p.fillDur);
    p.el.style.fill = p.color;
    p.el.style.fillOpacity = fillT;
    p.el.style.strokeOpacity = 1 - fillT;
  });
  const fadeStart = lastEnd + HOLD;
  const fadeT = clamp01((t - fadeStart) / FADEOUT);
  allGroup.style.opacity = 1 - fadeT;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
